[config]
schemaVersion = "0.0.1"

[package]
namespace = "Hentilador"
name = "GatsPrizeWheel"
description = "Use your hard earned gats to spin the Prize Wheel"
websiteUrl = "https://github.com/Hentilador/GatsWheel"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"

[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Debug/net48/GatsWheel.dll"
target = "BepInEx/plugins/GatsWheel.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = [ "mycopunk" ]

[publish.categories]
mycopunk = [ "client" ]


